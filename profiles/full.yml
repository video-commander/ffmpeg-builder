name: full

ffmpeg:
  version: 9.0.1
  enable_ffplay: false
  gpl: true
  nonfree: true
  ld_static: true

codecs:
  x264:   true
  x265:   true
  aom:    true
  svtav1: true
  vpx:    true
  dav1d:  true
  opus:   true
  lame:   true
  fdk_aac: true # non-free codec
  ass:    true
  zimg:   true
  vmaf:   true
  srt:    true

system:
  parallel: 8

ports:
  x264:
    version: "stable"
  x265:
    version: "4.2"
  aom:
    version: "v3.15.0"
  svtav1:
    version: "v4.2.0"
  vpx:
    version: "v1.17.0"
  dav1d:
    version: "1.5.4"
  opus:
    version: "v1.5.2"
  lame:
    version: "4.0"
  openssl:
    version: "3.5.8"
  srt:
    version: "v1.5.7"
  vmaf:
    version: "v3.2.0"
  libass:
    version: "0.17.5"
  freetype:
    version: "VER-2-14-3"
  fribidi:
    version: "v1.0.16"
  harfbuzz:
    version: "14.4.0"
  zimg:
    version: "release-3.0.6"
  fdk_aac:
    version: "v2.0.3"
