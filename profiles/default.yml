name: default

ffmpeg:
  version: 9.0.1
  enable_ffplay: false
  gpl: true
  nonfree: false         # no fdk-aac, fully redistributable GPL build
  ld_static: true

codecs:
  x264:   true
  x265:   true
  aom:    true           # libaom AV1
  svtav1: true           # AV1 encode, an order of magnitude faster than libaom
  vpx:    true           # VP8/VP9
  dav1d:  true           # AV1 decode, faster than the native decoder
  opus:   true
  lame:   true           # MP3 encode; FFmpeg has no built-in MP3 encoder
  fdk_aac: false
  ass:    true           # libass stack (freetype/fribidi/harfbuzz/libass)
  zimg:   true           # zscale — colour space, transfer and tone mapping
  vmaf:   true
  srt:    true

system:
  parallel: 8

ports:
  x264:
    version: "stable"    # handled in x264.sh (e.g. latest master or tag)
  x265:
    version: "4.2"
  aom:
    version: "v3.15.0"
  svtav1:
    version: "v4.2.0"
  vpx:
    version: "v1.17.0"
  dav1d:
    version: "1.5.4"
  opus:
    version: "v1.5.2"
  lame:
    version: "4.0"
  openssl:
    version: "3.5.8"
  srt:
    version: "v1.5.7"
  vmaf:
    version: "v3.2.0"
  libass:
    version: "0.17.5"
  freetype:
    version: "VER-2-14-3"
  fribidi:
    version: "v1.0.16"
  harfbuzz:
    version: "14.4.0"
  zimg:
    version: "release-3.0.6"
